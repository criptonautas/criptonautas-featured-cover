name: Build

on:
  push:
    branches: [main]
  pull_request:

env:
  IMAGE: ghcr.io/criptonautas/criptonautas-featured-cover
  COVER_TOKEN: check-token-only-used-inside-this-workflow

permissions:
  contents: read

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.13"
      - name: Install Inter Tight and Python packages
        run: |
          sudo apt-get install -y --no-install-recommends libcairo2 fontconfig
          mkdir -p ~/.local/share/fonts && cp assets/InterTight.ttf ~/.local/share/fonts/ && fc-cache -f
          pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover tests

      - name: Build image
        run: docker build --label org.opencontainers.image.source=https://github.com/${{ github.repository }} -t $IMAGE:latest -t $IMAGE:${{ github.sha }} .
      - name: Run image with production limits
        run: docker run -d --name cover -p 127.0.0.1:8000:8000 -e COVER_TOKEN --read-only --tmpfs /tmp --memory 256m --cpus 0.5 --pids-limit 64 --cap-drop ALL --security-opt no-new-privileges $IMAGE:latest
      - name: Wait until healthy
        run: |
          for i in $(seq 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' cover)" = healthy ] && exit 0
            sleep 2
          done
          exit 1
      - name: Service check
        run: python tests/service_check.py
      - if: failure()
        run: docker logs cover

      - name: Publish to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push --all-tags $IMAGE
